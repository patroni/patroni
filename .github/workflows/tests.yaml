name: macOS network privacy diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DCS: raft
      PGVERSION: 16.1-1
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.8
    - name: Install dependencies
      run: python .github/workflows/install_deps.py
    - name: Compare normal and SSH bootstrap
      run: python -u .github/workflows/probe_macos_network.py
    - name: Upload diagnostic logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-network-probe
        path: |
          macos-network-probe-output/*.log
          macos-network-probe-output/*.json
          macos-network-probe-output/*-services/**/*.log
          macos-network-probe-output/*-services/**/*.csv
        if-no-files-found: error
        retention-days: 5
