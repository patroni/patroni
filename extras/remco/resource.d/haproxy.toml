name = "haproxy"
[[template]]
src = "/etc/remco/templates/haproxy.tmpl"
dst = "/etc/haproxy/haproxy.cfg"
make_directories = true
reload_cmd = "haproxy -f {{ .dst }} -p /var/run/haproxy.pid -D -sf $(cat /var/run/haproxy.pid)"

check_cmd = "/usr/sbin/haproxy -c -f {{ .src }}"
mode = "0644"

[backend]
[backend.etcd]
# replace $BACKEND_NODES by the actual list of backend nodes 
nodes = [
    "http://...:2379",
    "http://...:2379",
    "http://...:2379"
]
prefix = "/service/demo"
keys = ["/members"]
watchKeys = ["/haproxy/reload"]
watch = true
interval = 60
version = 3
